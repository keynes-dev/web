<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Conveyor SVG fidelity gate</title>
  <style>
    :root {
      font-family: monospace;
      color: oklch(0.268 0.011 36.5);
      background: oklch(0.954 0.038 75.164);
      --conveyor-ground: oklch(0.954 0.038 75.164);
    }
    body {
      margin: 0;
    }
    header {
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .drawing {
      height: 416px;
      position: relative;
      overflow: hidden;
    }
    .drawing > div {
      position: absolute;
      inset: 0;
    }
    @media (max-width: 1023px) {
      .drawing {
        height: 256px;
      }
    }
    @media (max-width: 639px) {
      .drawing {
        height: 224px;
      }
    }
    #candidate {
      visibility: hidden;
    }
    output {
      display: block;
      white-space: pre-wrap;
      padding: 12px;
    }
  </style>
  <header>
    <button id="reference">Reference</button><button id="svg">SVG</button
    ><button id="overlay">Overlay</button>
    <label
      ><span id="time-label">Turn time</span>
      <input id="time" type="number" min="0" max="1.9" step="0.001" value="0"
    /></label>
    <button id="play">Play turn</button
    ><button id="measure">Measure turn</button>
    <button id="capture-frame">Capture frame</button
    ><button id="capture-phases">Capture phase boundaries</button>
    <button id="capture">Capture turn</button
    ><button id="baseline">Capture full reference</button>
  </header>
  <div class="drawing">
    <div id="original"></div>
    <div id="candidate"></div>
  </div>
  <output id="status">Loading reference and SVG gate...</output>
  <script type="module" src="./study.js"></script>
</html>
